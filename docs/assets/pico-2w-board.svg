<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Raspberry Pi Pico 2 W board</title>
  <desc id="desc">A polished illustration of a Raspberry Pi Pico 2 W development board with a visible wireless module, chip, and GPIO pins.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#08131d"/>
      <stop offset="100%" stop-color="#112334"/>
    </linearGradient>
    <linearGradient id="board" x1="0" x2="1">
      <stop offset="0%" stop-color="#1a2432"/>
      <stop offset="45%" stop-color="#101c2b"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="chip" x1="0" x2="1">
      <stop offset="0%" stop-color="#273f5f"/>
      <stop offset="100%" stop-color="#182c42"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8fbff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#b9c8d8" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="led" x1="0" x2="1">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020b11" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <circle cx="996" cy="118" r="138" fill="#16385b" opacity="0.7"/>
  <circle cx="1032" cy="144" r="84" fill="#122b42" opacity="0.8"/>

  <g filter="url(#shadow)" transform="translate(162 136)">
    <rect x="0" y="0" width="872" height="430" rx="34" fill="url(#board)" stroke="#7dd3fc" stroke-width="6"/>
    <rect x="30" y="26" width="812" height="378" rx="18" fill="none" stroke="#36577d" stroke-opacity="0.7" stroke-width="2"/>

    <g>
      <rect x="84" y="58" width="248" height="308" rx="22" fill="#0f1b2b" stroke="#3a536d" stroke-width="4"/>
      <rect x="108" y="82" width="200" height="260" rx="16" fill="#0a1320" stroke="#1a2d45" stroke-width="2"/>
      <rect x="132" y="106" width="152" height="110" rx="12" fill="#0d2139" stroke="#8ccef8" stroke-width="3"/>
      <rect x="132" y="230" width="152" height="82" rx="14" fill="url(#chip)" stroke="#7dd3fc" stroke-width="3"/>
      <circle cx="208" cy="272" r="24" fill="#1a3656" stroke="#7dd3fc" stroke-width="3"/>
