      <rect x="786" y="170" width="34" height="70" rx="12" fill="#0d1826" stroke="#71d1ff" stroke-width="3"/>
      <rect x="786" y="254" width="34" height="70" rx="12" fill="#0d1826" stroke="#71d1ff" stroke-width="3"/>
      <rect x="786" y="338" width="34" height="70" rx="12" fill="#0d1826" stroke="#71d1ff" stroke-width="3"/>
      <circle cx="803" cy="121" r="7" fill="#7dd3fc"/>
      <circle cx="803" cy="205" r="7" fill="#7dd3fc"/>
      <circle cx="803" cy="289" r="7" fill="#7dd3fc"/>
      <circle cx="803" cy="373" r="7" fill="#7dd3fc"/>
    </g>

    <g transform="translate(110 96)" fill="#8ec9ff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">
