      <rect x="194" y="404" width="80" height="8" rx="4"/>
      <rect x="306" y="404" width="80" height="8" rx="4"/>
      <rect x="418" y="404" width="80" height="8" rx="4"/>
      <rect x="530" y="404" width="80" height="8" rx="4"/>
