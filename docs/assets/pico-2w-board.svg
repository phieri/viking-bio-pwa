    </g>

    <g>
      <rect x="374" y="70" width="396" height="290" rx="22" fill="#15273b" stroke="#7dd3fc" stroke-width="4"/>
      <rect x="404" y="104" width="336" height="70" rx="12" fill="#1b3354" stroke="#99d3ff" stroke-width="2"/>
      <path d="M510 168h120l86-42v18h88v62h-88v18l-86-42H510z" fill="#0d1e2f" stroke="#7dd3fc" stroke-width="2" opacity="0.95"/>
