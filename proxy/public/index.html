<!DOCTYPE html>
<html lang="sv" data-demo="false">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e242a">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
<title>Viking Bio 20 – instrumentpanel</title>
</head>
<body>
<div class="top-actions">
	<a class="top-link" href="/docs.html">Installationsguide</a>
</div>
<button id="fullscreenBtn" class="fullscreen-btn" type="button" aria-pressed="false" aria-label="Gå till fullskärm">Fullskärm</button>
<header id="dashboard-header" class="page-header">
	<h1 class="page-header__primary">Pelletsbrännare</h1>
	<p class="page-header__subtitle">Viking Bio 20</p>
</header>
<div class="status connecting" id="status">Ansluter...</div>
<div class="grid">
	<div class="card" id="flame-card">
		<div class="label">Låga</div>
		<div class="value flame-value" id="flame" aria-live="polite" data-animate="false">
			<span class="flame-value__content">-</span>
		</div>
	</div>
	<div class="card">
		<div class="label">Fläkthastighet</div>
		<div class="value" id="fan" data-animate="true">-</div>
		<div class="unit">%</div>
	</div>
	<div class="card">
		<div class="label">Temperatur</div>
		<div class="value" id="temp" data-animate="true">-</div>
		<div class="unit">&deg;C</div>
	</div>
	<div class="card">
		<div class="label">Felkod</div>
		<div class="value" id="err" data-animate="false">-</div>
		<div class="unit">kod</div>
	</div>
	<div class="card">
		<div class="label">Brinntid</div>
		<div class="value" id="flame-hours" data-animate="true">-</div>
		<div class="unit">timmar</div>
	</div>
	<div class="card">
		<div class="label">Säsongsskifte</div>
		<div class="value" id="season-countdown">-</div>
		<div class="unit" id="season-target">dagar</div>
	</div>
	<div class="card" id="energy-price-card" hidden>
		<div class="label">Pannpris</div>
		<div class="value" id="energy-price-value">-</div>
		<div class="unit" id="energy-price-unit">kr/kWh</div>
		<div class="energy-price-detail" id="energy-price-detail"></div>
	</div>
</div>
<footer class="page-footer">
 	<button id="tourBtn" class="footer-tour-link" type="button">Rundtur</button>
</footer>
</body>
</html>
