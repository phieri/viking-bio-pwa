version: 2

project_name: viking-bio-configurator

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: viking-bio-configurator-linux
    dir: configurator
    main: ./cmd/configurator
    binary: viking-bio-configurator
    env:
      - CGO_ENABLED=1
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/phieri/viking-bio-pwa/configurator/internal/version.Version={{.Version}} -X github.com/phieri/viking-bio-pwa/configurator/internal/version.Commit={{.Commit}} -X github.com/phieri/viking-bio-pwa/configurator/internal/version.Date={{.Date}}
    flags:
      - -trimpath

  - id: viking-bio-configurator-windows
    dir: configurator
    main: ./cmd/configurator
    binary: viking-bio-configurator
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
    ldflags:
      - -s -w -X github.com/phieri/viking-bio-pwa/configurator/internal/version.Version={{.Version}} -X github.com/phieri/viking-bio-pwa/configurator/internal/version.Commit={{.Commit}} -X github.com/phieri/viking-bio-pwa/configurator/internal/version.Date={{.Date}}
    flags:
      - -trimpath

archives:
  - id: linux
    builds:
      - viking-bio-configurator-linux
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - configurator/README.md
      - configurator/.env.example
      - LICENSE

  - id: windows
    builds:
      - viking-bio-configurator-windows
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip
    files:
      - configurator/README.md
      - configurator/.env.example
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "Merge pull request"
      - "Merge branch"

nfpms:
  - id: linux-packages
    builds:
      - viking-bio-configurator-linux
    package_name: viking-bio-configurator
    vendor: Viking Bio
    homepage: https://github.com/phieri/viking-bio-pwa
    maintainer: Viking Bio contributors
    description: Viking Bio 20 pellet burner configurator and local telemetry API
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: configurator/README.md
        dst: /usr/share/doc/viking-bio-configurator/README.md
      - src: configurator/.env.example
        dst: /usr/share/doc/viking-bio-configurator/.env.example
      - type: ghost
        dst: /etc/viking-bio-configurator/.env
